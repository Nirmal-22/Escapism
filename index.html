<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Escapism — a browser 3D dodge game with a global leaderboard.">
    <title>Escapism</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🟩</text></svg>">
    <style>
        :root {
            --bg: #0b1220;
            --panel: #0f1b2d;
            --line: rgba(148, 163, 184, .18);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --green: #22c55e;
            --red: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }
        #gameCanvas { display: block; width: 100%; height: 100%; }
        .hud { position: absolute; top: 14px; left: 16px; }
        .brand { font-weight: 800; letter-spacing: .35em; font-size: 12px; color: var(--green); margin-bottom: 6px; }
        #score { font-size: 26px; font-weight: 700; }
        #best { font-size: 13px; color: var(--muted); margin-top: 2px; }
        #nameChip {
            margin-top: 8px; display: inline-flex; gap: 6px; align-items: center;
            font-size: 12px; color: var(--muted); background: rgba(15, 27, 45, .75);
            border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; cursor: pointer;
        }
        #nameChip:hover { color: var(--text); }
        #gameControls { position: absolute; top: 14px; right: 16px; display: flex; gap: 8px; }
        button {
            padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
            border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
        }
        button:hover { border-color: rgba(148, 163, 184, .45); }
        button.primary { background: var(--green); border-color: var(--green); color: #052e16; }
        button.primary:hover { filter: brightness(1.08); }
        .overlay {
            display: none; position: fixed; inset: 0; background: rgba(8, 13, 23, .82);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .overlay.show { display: flex; }
        .modal {
            background: var(--panel); border: 1px solid var(--line); color: var(--text);
            padding: 28px; border-radius: 14px; width: min(92vw, 560px); max-height: 86vh;
            overflow: auto; box-shadow: 0 22px 60px rgba(0, 0, 0, .5); position: relative;
        }
        .modal h2 { margin: 0 0 6px; }
        .modal .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
        .modal .actions { display: flex; gap: 10px; margin-top: 20px; }
        input[type=text] {
            width: 100%; padding: 11px 12px; font-size: 16px; border-radius: 8px;
            border: 1px solid var(--line); background: #0b1524; color: var(--text); outline: none;
        }
        input[type=text]:focus { border-color: var(--green); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
        th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
        tr.you td { background: rgba(34, 197, 94, .12); color: var(--green); font-weight: 700; }
        .close-x { position: absolute; top: 12px; right: 12px; padding: 6px 11px; }
        .badge {
            display: inline-block; background: var(--green); color: #052e16; font-size: 11px;
            font-weight: 800; border-radius: 999px; padding: 3px 9px; margin-left: 8px; vertical-align: middle;
        }
        #rankLine { color: var(--muted); margin: 10px 0 14px; font-size: 14px; min-height: 18px; }
        .pill {
            position: absolute; left: 50%; transform: translateX(-50%);
            background: rgba(15, 27, 45, .9); border: 1px solid var(--line); border-radius: 999px;
            padding: 10px 18px; font-size: 13px; color: var(--muted); transition: opacity .6s;
        }
        #hint { bottom: 36px; opacity: 0; pointer-events: none; }
        #touchBanner { bottom: 36px; display: none; gap: 10px; align-items: center; }
        kbd {
            background: #1e293b; border: 1px solid var(--line); border-bottom-width: 2px;
            border-radius: 5px; padding: 1px 6px; font-size: 12px; color: var(--text);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
        <div class="brand">ESCAPISM</div>
        <div id="score">Score: 0</div>
        <div id="best">Best: 0</div>
        <div id="nameChip" title="Change name"><span id="nameChipText">set your name</span><span>✎</span></div>
    </div>

    <div id="gameControls">
        <button id="startButton" class="primary">Start Game</button>
        <button id="pauseButton" style="display:none">Pause</button>
        <button id="exitButton" style="display:none">Exit</button>
        <button id="scoreboardBtn">Leaderboard</button>
    </div>

    <div id="hint" class="pill"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Space</kbd> jump · <kbd>P</kbd> pause · drag mouse to look</div>
    <div id="touchBanner" class="pill">⌨️ Escapism needs a keyboard — open on desktop for the full game <button id="dismissTouch" style="padding:4px 10px">✕</button></div>

    <div id="nameOverlay" class="overlay">
        <div class="modal" style="width:min(92vw,420px)">
            <h2>Who's playing?</h2>
            <p class="sub">Shown on the global leaderboard. Saved on this device.</p>
            <input id="nameInput" type="text" maxlength="20" placeholder="Your name" autocomplete="off">
            <div class="actions">
                <button id="nameSave" class="primary" style="flex:1">Let's go</button>
                <button id="nameCancel">Cancel</button>
            </div>
        </div>
    </div>

    <div id="deathOverlay" class="overlay">
        <div class="modal">
            <h2>You got cubed!</h2>
            <p class="sub" id="deathStats"></p>
            <div id="rankLine"></div>
            <div id="deathBoard"></div>
            <div class="actions">
                <button id="playAgainBtn" class="primary" style="flex:1">Play again — Space</button>
                <button id="menuBtn">Menu</button>
            </div>
        </div>
    </div>

    <div id="scoreboardOverlay" class="overlay">
        <div class="modal">
            <button id="closeScoreboard" class="close-x">✕</button>
            <h2>Leaderboard</h2>
            <p class="sub">Top 10 worldwide</p>
            <div id="scoreboardContent"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Same-origin API in production (Vercel) and via the local dev server;
        // falls back to localhost:3000 when index.html is opened straight from disk.
        const API_BASE = location.protocol === 'file:' ? 'http://localhost:3000' : '';

        const PLAYER_SPEED = 10;
        const JUMP_VELOCITY = 15;
        const GRAVITY = -20;
        const GROUND_HALF_X = 9;
        const GROUND_HALF_Z = 49;
        const MAX_DELTA = 0.05; // clamp: background tabs must not produce teleport-sized steps

        let scene, camera, renderer, cube, ground;
        let enemies = [];
        let score = 0;
        let best = Number(localStorage.getItem('escapismBest')) || 0;
        let gameState = 'idle'; // idle | playing | paused | gameOver
        let lastTime = 0;
        let cameraAngleX = 0.18;
        let cameraAngleY = 0;
        let isMouseDown = false;
        let playerName = localStorage.getItem('playerName') || '';
        const keys = new Set();
        let nameOverlayMode = 'edit';

        const el = (id) => document.getElementById(id);

        // ---------- three.js scene ----------
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b1220);
            scene.fog = new THREE.Fog(0x0b1220, 55, 105); // enemies fade in at distance

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ canvas: el('gameCanvas'), antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 10, 7);
            light.castShadow = true;
            light.shadow.mapSize.width = 1024;
            light.shadow.mapSize.height = 1024;
            light.shadow.camera.near = 1;
            light.shadow.camera.far = 50;
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            cube = createBox(1, 1, 1, 0x22c55e, 0, 0.5, 0);
            cube.castShadow = true;
            scene.add(cube);

            ground = createBox(20, 0.1, 100, 0x0369a1, 0, 0, 0);
            ground.receiveShadow = true;
            scene.add(ground);

            updateCamera();

            window.addEventListener('resize', onWindowResize);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', () => { isMouseDown = true; });
            document.addEventListener('mouseup', () => { isMouseDown = false; });
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    keys.clear();
                    if (gameState === 'playing') setPaused(true);
                }
            });
            window.addEventListener('blur', () => keys.clear());
        }

        function createBox(width, height, depth, color, x, y, z) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshStandardMaterial({ color });
            const box = new THREE.Mesh(geometry, material);
            box.position.set(x, y, z);
            box.width = width;
            box.height = height;
            box.depth = depth;
            box.velocity = { x: 0, y: 0, z: 0 };
            return box;
        }

        // ---------- difficulty (scales with score, capped) ----------
        const enemySpeed = () => Math.min(10 + score * 0.12, 22);
        const spawnPerSecond = () => Math.min(1 + score * 0.06, 4);

        // ---------- game flow ----------
        function setButtons() {
            const inRun = gameState === 'playing' || gameState === 'paused';
            el('startButton').style.display = inRun ? 'none' : 'inline-block';
            el('pauseButton').style.display = inRun ? 'inline-block' : 'none';
            el('exitButton').style.display = inRun ? 'inline-block' : 'none';
            el('pauseButton').textContent = gameState === 'paused' ? 'Resume' : 'Pause';
        }

        function resetRun() {
            enemies.forEach((enemy) => scene.remove(enemy));
            enemies = [];
            cube.position.set(0, 0.5, 0);
            cube.velocity = { x: 0, y: 0, z: 0 };
            score = 0;
            updateHud();
        }

        function requestStart() {
            if (!playerName) {
                openNameOverlay('start');
                return;
            }
            startGame();
        }

        function startGame() {
            hideOverlay('deathOverlay');
            resetRun();
            keys.clear();
            gameState = 'playing';
            setButtons();
            maybeShowHint();
        }

        function setPaused(paused) {
            if (gameState !== 'playing' && gameState !== 'paused') return;
            gameState = paused ? 'paused' : 'playing';
            setButtons();
        }

        function togglePause() {
            setPaused(gameState === 'playing');
        }

        function exitToMenu() {
            gameState = 'idle';
            resetRun();
            setButtons();
            hideOverlay('deathOverlay');
        }

        function playAgain() {
            if (!playerName) {
                openNameOverlay('start');
                return;
            }
            startGame();
        }

        // ---------- main loop ----------
        function animate(now) {
            requestAnimationFrame(animate);
            const deltaTime = Math.min((now - lastTime) / 1000, MAX_DELTA) || 0;
            lastTime = now;

            if (gameState === 'playing') {
                updateCube(deltaTime);
                updateEnemies(deltaTime);
                spawnEnemies(deltaTime);
                updateCamera();
            }
            renderer.render(scene, camera);
        }

        function updateCube(deltaTime) {
            // velocity derived from currently-held keys: releasing one key never cancels another
            cube.velocity.x = (keys.has('KeyD') ? PLAYER_SPEED : 0) - (keys.has('KeyA') ? PLAYER_SPEED : 0);
            cube.velocity.z = (keys.has('KeyS') ? PLAYER_SPEED : 0) - (keys.has('KeyW') ? PLAYER_SPEED : 0);

            cube.position.x += cube.velocity.x * deltaTime;
            cube.position.z += cube.velocity.z * deltaTime;

            cube.velocity.y += GRAVITY * deltaTime;
            cube.position.y += cube.velocity.y * deltaTime;
            if (cube.position.y < 0.5) {
                cube.position.y = 0.5;
                cube.velocity.y = 0;
            }

            cube.position.x = Math.max(-GROUND_HALF_X, Math.min(GROUND_HALF_X, cube.position.x));
            cube.position.z = Math.max(-GROUND_HALF_Z, Math.min(GROUND_HALF_Z, cube.position.z));
        }

        function updateCamera() {
            const radius = 15;
            const x = radius * Math.sin(cameraAngleY) * Math.cos(cameraAngleX);
            const y = Math.max(radius * Math.sin(cameraAngleX), 0.5);
            const z = radius * Math.cos(cameraAngleY) * Math.cos(cameraAngleX);
            camera.position.set(cube.position.x + x, cube.position.y + y, cube.position.z + z);
            camera.lookAt(cube.position);
        }

        function updateEnemies(deltaTime) {
            const speed = enemySpeed();
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.position.z += speed * deltaTime;

                if (boxCollision(cube, enemy)) {
                    gameOver();
                    return;
                }

                if (enemy.position.z > 50) {
                    scene.remove(enemy);
                    enemies.splice(i, 1);
                    score++;
                    updateHud();
                }
            }
        }

        function spawnEnemies(deltaTime) {
            // per-second probability × deltaTime → identical difficulty at any frame rate
            if (Math.random() < Math.min(spawnPerSecond() * deltaTime, 0.9)) {
                const enemy = createBox(1, 1, 1, 0xef4444, (Math.random() - 0.5) * 18, 0.5, -50);
                enemy.castShadow = true;
                scene.add(enemy);
                enemies.push(enemy);
            }
        }

        function boxCollision(box1, box2) {
            return (
                Math.abs(box1.position.x - box2.position.x) * 2 < (box1.width + box2.width) &&
                Math.abs(box1.position.y - box2.position.y) * 2 < (box1.height + box2.height) &&
                Math.abs(box1.position.z - box2.position.z) * 2 < (box1.depth + box2.depth)
            );
        }

        // ---------- death & leaderboard ----------
        function gameOver() {
            gameState = 'gameOver';
            setButtons();
            const isNewBest = score > best;
            if (isNewBest) {
                best = score;
                localStorage.setItem('escapismBest', String(best));
            }
            updateHud();
            showDeathOverlay(isNewBest);
        }

        async function showDeathOverlay(isNewBest) {
            const stats = el('deathStats');
            stats.textContent = `You dodged ${score} cube${score === 1 ? '' : 's'} · Best: ${best}`;
            if (isNewBest) {
                const badge = document.createElement('span');
                badge.className = 'badge';
                badge.textContent = 'NEW BEST';
                stats.appendChild(badge);
            }
            el('rankLine').textContent = 'Saving your score…';
            el('deathBoard').textContent = '';
            showOverlay('deathOverlay');

            let myRank = null;
            try {
                const saved = await submitScore(playerName, score);
                myRank = saved.rank;
                el('rankLine').textContent = `World rank #${saved.rank} as ${saved.name}`;
            } catch (err) {
                el('rankLine').textContent = 'Could not reach the leaderboard — score not saved.';
            }
            try {
                const top = await fetchTopScores(10);
                renderScoreTable(el('deathBoard'), top, myRank);
            } catch (err) {
                // rankLine already tells the offline story
            }
        }

        async function fetchTopScores(limit) {
            const res = await fetch(`${API_BASE}/api/scores?limit=${limit}`);
            if (!res.ok) throw new Error(`leaderboard request failed (${res.status})`);
            return res.json();
        }

        async function submitScore(name, value) {
            const res = await fetch(`${API_BASE}/api/scores`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, score: value })
            });
            if (!res.ok) throw new Error(`score submit failed (${res.status})`);
            return res.json();
        }

        function renderScoreTable(container, scores, highlightRank) {
            container.textContent = '';
            if (!scores.length) {
                container.textContent = 'No scores yet — be the first!';
                return;
            }
            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            ['#', 'Name', 'Score', 'When'].forEach((text) => {
                const th = document.createElement('th');
                th.textContent = text;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            const addRow = (cells, isYou) => {
                const tr = document.createElement('tr');
                if (isYou) tr.className = 'you';
                cells.forEach((value) => {
                    const td = document.createElement('td');
                    td.textContent = value; // textContent only — player names are untrusted
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            };
            scores.forEach((item, i) => {
                const rank = i + 1;
                addRow(
                    [String(rank), item.name, String(item.score), formatDate(item.date)],
                    highlightRank === rank && item.name === playerName
                );
            });
            if (highlightRank && highlightRank > scores.length) {
                addRow([String(highlightRank), playerName, String(score), 'just now'], true);
            }
            table.appendChild(tbody);
            container.appendChild(table);
        }

        function formatDate(iso) {
            const d = new Date(iso);
            return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }

        async function openLeaderboard() {
            if (gameState === 'playing') setPaused(true);
            el('scoreboardContent').textContent = 'Loading…';
            showOverlay('scoreboardOverlay');
            try {
                renderScoreTable(el('scoreboardContent'), await fetchTopScores(10), null);
            } catch (err) {
                el('scoreboardContent').textContent = 'Leaderboard unavailable right now — try again in a moment.';
            }
        }

        // ---------- overlays, name, HUD ----------
        function showOverlay(id) { el(id).classList.add('show'); }
        function hideOverlay(id) { el(id).classList.remove('show'); }
        const overlayVisible = (id) => el(id).classList.contains('show');

        function openNameOverlay(mode) {
            nameOverlayMode = mode;
            el('nameInput').value = playerName;
            showOverlay('nameOverlay');
            setTimeout(() => el('nameInput').focus(), 50);
        }

        function saveNameFromOverlay() {
            const value = el('nameInput').value.replace(/\s+/g, ' ').trim();
            if (!value) {
                el('nameInput').focus();
                return;
            }
            playerName = value.slice(0, 20);
            localStorage.setItem('playerName', playerName);
            updateNameChip();
            hideOverlay('nameOverlay');
            if (nameOverlayMode === 'start') startGame();
        }

        function updateNameChip() {
            el('nameChipText').textContent = playerName || 'set your name';
        }

        function updateHud() {
            el('score').textContent = `Score: ${score}`;
            el('best').textContent = `Best: ${best}`;
        }

        function maybeShowHint() {
            if (localStorage.getItem('escapismSeenHint')) return;
            localStorage.setItem('escapismSeenHint', '1');
            const hint = el('hint');
            hint.style.opacity = '1';
            setTimeout(() => { hint.style.opacity = '0'; }, 4500);
        }

        // ---------- input ----------
        document.addEventListener('keydown', (event) => {
            if (overlayVisible('nameOverlay')) {
                if (event.code === 'Enter') saveNameFromOverlay();
                if (event.code === 'Escape') hideOverlay('nameOverlay');
                return;
            }
            if (overlayVisible('deathOverlay')) {
                if (event.code === 'Space' || event.code === 'Enter' || event.code === 'KeyR') {
                    event.preventDefault();
                    playAgain();
                }
                if (event.code === 'Escape') exitToMenu();
                return;
            }
            if (overlayVisible('scoreboardOverlay')) {
                if (event.code === 'Escape') hideOverlay('scoreboardOverlay');
                return;
            }
            if (gameState !== 'playing' && gameState !== 'paused') return;
            if (event.code === 'KeyP') {
                togglePause();
                return;
            }
            if (gameState !== 'playing') return;
            if (event.code === 'Space') {
                event.preventDefault();
                if (cube.position.y <= 0.5) cube.velocity.y = JUMP_VELOCITY; // grounded only — no air-jumps
                return;
            }
            keys.add(event.code);
        });

        document.addEventListener('keyup', (event) => keys.delete(event.code));

        function onMouseMove(event) {
            if (gameState === 'playing' && isMouseDown) {
                cameraAngleY += (event.movementX || 0) * 0.002;
                cameraAngleX += (event.movementY || 0) * 0.002;
                cameraAngleX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, cameraAngleX));
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ---------- wiring ----------
        el('startButton').addEventListener('click', (e) => { e.target.blur(); requestStart(); });
        el('pauseButton').addEventListener('click', (e) => { e.target.blur(); togglePause(); });
        el('exitButton').addEventListener('click', (e) => { e.target.blur(); exitToMenu(); });
        el('scoreboardBtn').addEventListener('click', (e) => { e.target.blur(); openLeaderboard(); });
        el('closeScoreboard').addEventListener('click', () => hideOverlay('scoreboardOverlay'));
        el('nameSave').addEventListener('click', saveNameFromOverlay);
        el('nameCancel').addEventListener('click', () => hideOverlay('nameOverlay'));
        el('playAgainBtn').addEventListener('click', (e) => { e.target.blur(); playAgain(); });
        el('menuBtn').addEventListener('click', (e) => { e.target.blur(); exitToMenu(); });
        el('nameChip').addEventListener('click', () => openNameOverlay('edit'));

        if ('ontouchstart' in window && !localStorage.getItem('escapismTouchDismissed')) {
            el('touchBanner').style.display = 'inline-flex';
        }
        el('dismissTouch').addEventListener('click', () => {
            localStorage.setItem('escapismTouchDismissed', '1');
            el('touchBanner').style.display = 'none';
        });

        // ---------- boot ----------
        init();
        updateHud();
        updateNameChip();
        requestAnimationFrame((t) => {
            lastTime = t;
            animate(t);
        });
    </script>
</body>
</html>
