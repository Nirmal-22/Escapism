<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Cube Game</title>
    <style>
        body { margin: 0; overflow: hidden; }
        #gameCanvas { width: 100%; height: 100%; display: block; }
        #gameUI {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
        }
        #score { font-size: 24px; }
        #gameControls {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body style="user-select: none;">
    <canvas id="gameCanvas"></canvas>
    <div id="gameUI">
        <div id="score">Score: 0</div>
    </div>
    <div id="gameControls">
        <button id="startButton">Start Game</button>
        <button id="pauseButton" style="display: none;">Pause</button>
        <button id="exitButton" style="display: none;">Exit</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game variables
        let scene, camera, renderer, cube, ground, enemies = [];
        let score = 0;
        let gameState = 'idle';
        let lastTime = 0;
        let cameraAngleX = 0;
        let cameraAngleY = 0;
        let isMouseDown = false;
        let playerName = '';
    
        // Set up the scene
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);
    
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
    
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(5, 10, 7);
            light.castShadow = true;
            light.shadow.mapSize.width = 1024;
            light.shadow.mapSize.height = 1024;
            light.shadow.camera.near = 1;
            light.shadow.camera.far = 50;
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    
            initializeGameObjects();
    
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousemove', onMouseMove, false);
            document.addEventListener('mousedown', () => { isMouseDown = true; });
            document.addEventListener('mouseup', () => { isMouseDown = false; });
        }
    
        function initializeGameObjects() {
            cube = createBox(1, 1, 1, 0x00ff00, 0, 0.5, 0);
            cube.castShadow = true;
            scene.add(cube);
    
            ground = createBox(20, 0.1, 100, 0x0369a1, 0, 0, 0);
            ground.receiveShadow = true;
            scene.add(ground);
        }
    
        function createBox(width, height, depth, color, x, y, z) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshStandardMaterial({ color });
            const box = new THREE.Mesh(geometry, material);
            box.position.set(x, y, z);
            box.width = width;
            box.height = height;
            box.depth = depth;
            box.velocity = { x: 0, y: 0, z: 0 };
            return box;
        }
    
        function resetGame() {
            enemies.forEach(enemy => scene.remove(enemy));
            enemies = [];
            cube.position.set(0, 0.5, 0);
            cube.velocity = { x: 0, y: 0, z: 0 };
            score = 0;
            updateScore();
        }
    
        function startGame() {
            playerName = prompt('Enter your name:');
            if (!playerName) {
                alert('Name is required to start the game.');
                return;
            }
            localStorage.setItem('playerName', playerName);
    
            resetGame();
            gameState = 'playing';
            lastTime = performance.now();
            document.getElementById('startButton').style.display = 'none';
            document.getElementById('pauseButton').style.display = 'inline';
            document.getElementById('exitButton').style.display = 'inline';
        }
    
        function pauseGame() {
            if (gameState === 'playing') {
                gameState = 'paused';
                document.getElementById('pauseButton').textContent = 'Resume';
            } else if (gameState === 'paused') {
                gameState = 'playing';
                lastTime = performance.now();
                document.getElementById('pauseButton').textContent = 'Pause';
            }
        }
    
        function exitGame() {
            gameState = 'idle';
            resetGame();
            document.getElementById('startButton').style.display = 'inline';
            document.getElementById('pauseButton').style.display = 'none';
            document.getElementById('exitButton').style.display = 'none';
        }
    
        function animate(currentTime) {
            requestAnimationFrame(animate);
    
            if (gameState === 'playing') {
                const deltaTime = (currentTime - lastTime) / 1000;
                lastTime = currentTime;
    
                updateCube(deltaTime);
                updateCamera();
                updateEnemies(deltaTime);
                spawnEnemies();
            }
    
            renderer.render(scene, camera);
        }
    
        function updateCube(deltaTime) {
            cube.position.x += cube.velocity.x * deltaTime;
            cube.position.z += cube.velocity.z * deltaTime;
    
            cube.velocity.y += -20 * deltaTime; // Increased gravity
            cube.position.y += cube.velocity.y * deltaTime;
    
            if (cube.position.y < 0.5) {
                cube.position.y = 0.5;
                cube.velocity.y = 0;
            }
    
            // Keep the cube within the ground boundaries
            cube.position.x = Math.max(-9, Math.min(9, cube.position.x));
            cube.position.z = Math.max(-49, Math.min(49, cube.position.z));
        }
    
        function updateCamera() {
            const radius = 15;
            const x = radius * Math.sin(cameraAngleY) * Math.cos(cameraAngleX);
            const y = radius * Math.sin(cameraAngleX);
            const z = radius * Math.cos(cameraAngleY) * Math.cos(cameraAngleX);
    
            camera.position.set(cube.position.x + x, cube.position.y + y, cube.position.z + z);
            camera.lookAt(cube.position);
        }
    
        function updateEnemies(deltaTime) {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                enemy.position.z += 10 * deltaTime;
    
                if (boxCollision(cube, enemy)) {
                    gameOver();
                    return;
                }
    
                if (enemy.position.z > 50) {
                    scene.remove(enemy);
                    enemies.splice(i, 1);
                    score++;
                    updateScore();
                }
            }
        }
    
        function spawnEnemies() {
            if (Math.random() < 0.02) {
                const enemy = createBox(1, 1, 1, 0xff0000, (Math.random() - 0.5) * 18, 0.5, -50);
                enemy.castShadow = true;
                scene.add(enemy);
                enemies.push(enemy);
            }
        }
    
        function boxCollision(box1, box2) {
            return (
                Math.abs(box1.position.x - box2.position.x) * 2 < (box1.width + box2.width) &&
                Math.abs(box1.position.y - box2.position.y) * 2 < (box1.height + box2.height) &&
                Math.abs(box1.position.z - box2.position.z) * 2 < (box1.depth + box2.depth)
            );
        }
    
        function gameOver() {
            gameState = 'gameOver';
            submitScore(playerName, score);
            alert(`Game Over! Your score: ${score}`);
            exitGame();
        }
    
        function updateScore() {
            document.getElementById('score').textContent = `Score: ${score}`;
        }
    
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    
        function onMouseMove(event) {
            if (gameState === 'playing' && isMouseDown) {
                const movementX = event.movementX || event.mozMovementX || event.webkitMovementX || 0;
                const movementY = event.movementY || event.mozMovementY || event.webkitMovementY || 0;
    
                cameraAngleY += movementX * 0.002; // Inverted X-axis
                cameraAngleX += movementY * 0.002; // Inverted Y-axis
    
                // Limit vertical rotation
                cameraAngleX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, cameraAngleX));
            }
        }
    
        // Event listeners
        document.addEventListener('keydown', (event) => {
            if (gameState !== 'playing') return;
    
            switch (event.code) {
                case 'KeyA': cube.velocity.x = -10; break;
                case 'KeyD': cube.velocity.x = 10; break;
                case 'KeyW': cube.velocity.z = -10; break;
                case 'KeyS': cube.velocity.z = 10; break;
                case 'Space':
                    if (cube.position.y <= 0.5) {
                        cube.velocity.y = 15;
                    }
                    event.preventDefault(); // Prevent spacebar from triggering button clicks
                    break;
            }
        });
    
        document.addEventListener('keyup', (event) => {
            if (gameState !== 'playing') return;
    
            switch (event.code) {
                case 'KeyA':
                case 'KeyD':
                    cube.velocity.x = 0;
                    break;
                case 'KeyW':
                case 'KeyS':
                    cube.velocity.z = 0;
                    break;
            }
        });
    
        document.getElementById('startButton').addEventListener('click', startGame);
        document.getElementById('pauseButton').addEventListener('click', (e) => {
            pauseGame();
            e.target.blur(); // Remove focus from the button after click
        });
        document.getElementById('exitButton').addEventListener('click', (e) => {
            exitGame();
            e.target.blur(); // Remove focus from the button after click
        });
    
        // Initialize and start the game loop
        init();
        animate();
    </script>
    <script>
        // Add this function to send the score to the backend
        async function submitScore(name, score) {
            console.log('Submitting score:', { name, score });
            const response = await fetch('http://localhost:3000/api/scores', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, score })
            });
            if (!response.ok) {
                console.error('Failed to submit score');
            } else {
                console.log('Score submitted successfully');
            }
        }
    </script>
</body>
</html>
